<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ARSA Admin - Command Center</title>

<!-- PWA Meta (BERBEDA dari user app) -->
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARSA Admin">
<meta name="application-name" content="ARSA Admin">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="./logo-AKI.png">
<link rel="icon" type="image/png" href="./logo-AKI.png">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#050806; font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }

/* Header bar (hanya tampil saat belum standalone) */
#topBar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:linear-gradient(135deg,#1a1f1c,#0d120f);
  border-bottom:1px solid rgba(251,191,36,0.2);
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; gap:10px;
}
body.standalone #topBar { display:none; }
body.standalone #appFrame { top:0 !important; }

.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-icon {
  width:36px; height:36px; border-radius:10px;
  object-fit:contain; background:#0a0f0d;
  box-shadow:0 2px 8px rgba(245,158,11,0.35);
  border:1px solid rgba(251,191,36,0.25);
}
.brand-text { display:flex; flex-direction:column; }
.brand-text .name { font-weight:800; font-size:14px; color:#fbbf24; letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-text .sub { font-size:9px; color:#94a3b8; letter-spacing:1px; text-transform:uppercase; }

.actions { display:flex; gap:8px; flex-shrink:0; }
.act-btn {
  height:36px; padding:0 14px; border-radius:10px; border:1px solid rgba(251,191,36,0.3);
  background:rgba(251,191,36,0.1); color:#fbbf24; font-weight:700; font-size:12px;
  cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .2s;
}
.act-btn:active { transform:scale(0.95); }
#btnInstall { background:linear-gradient(135deg,#f59e0b,#d97706); color:#000; border:none; box-shadow:0 4px 14px rgba(245,158,11,0.4); }
#btnInstall.hidden { display:none; }

/* Iframe app */
#appFrame {
  position:fixed; top:56px; left:0; right:0; bottom:0;
  width:100%; height:calc(100% - 56px); border:0; background:#050806;
}

/* Loading splash */
#splash {
  position:fixed; inset:0; z-index:90; background:#050806;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  transition:opacity .4s;
}
#splash.hide { opacity:0; pointer-events:none; }
.splash-icon {
  width:80px; height:80px; border-radius:20px;
  object-fit:contain;
  box-shadow:0 8px 32px rgba(245,158,11,0.4);
  animation:float 2.5s ease-in-out infinite;
}}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
#splash .title { color:#fbbf24; font-weight:800; font-size:16px; letter-spacing:2px; text-transform:uppercase; }
#splash .subtitle { color:#94a3b8; font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-top:-8px; }
.spinner { width:34px; height:34px; border:3px solid rgba(251,191,36,0.2); border-top-color:#f59e0b; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Offline overlay */
#offline {
  position:fixed; inset:0; z-index:120; background:rgba(5,8,6,0.96);
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  color:#f1f5f9; text-align:center; padding:24px;
}
#offline.show { display:flex; }
#offline .icon { font-size:48px; }
#offline h3 { color:#fbbf24; font-size:16px; }
#offline p { font-size:12px; color:#94a3b8; max-width:280px; }
#offline button { margin-top:8px; padding:10px 24px; border-radius:10px; background:#f59e0b; color:#000; font-weight:800; border:none; cursor:pointer; }

/* Toast */
#toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
  background:rgba(16,185,129,0.95); color:#fff; padding:10px 18px; border-radius:10px;
  font-size:12px; font-weight:700; z-index:200; transition:transform .3s; max-width:90%;
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* Info badge */
.info-badge {
  position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
  background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.3);
  color:#fbbf24; padding:6px 14px; border-radius:20px;
  font-size:10px; font-weight:700; z-index:50;
  display:flex; align-items:center; gap:6px;
}
</style>
</head>
<body>

<!-- Header -->
<div id="topBar">
  <div class="brand">
    <img src="./logo-AKI.png" alt="ARSA" class="brand-icon">
    <div class="brand-text">
      <span class="name">ARSA ADMIN</span>
      <span class="sub">Command Center</span>
    </div>
  </div>
  <div class="actions">
    <button class="act-btn" onclick="reloadApp()" title="Refresh"><span>🔄</span> Refresh</button>
    <button class="act-btn hidden" id="btnInstall" onclick="doInstall()"><span>📲</span> Install</button>
  </div>
</div>

<!-- Splash loading -->
<div id="splash">
  <img src="./logo-AKI.png" alt="ARSA" class="splash-icon">
  <div class="title">ARSA ADMIN</div>
  <div class="subtitle">Command Center</div>
  <div class="spinner"></div>
</div>

<!-- App iframe (load admin panel dari GAS) -->
<iframe id="appFrame" 
  src="https://script.google.com/macros/s/AKfycbypofLYPOd7q_SBKEx7_eYXktqRp9b8cPNO4hO1yUE4BdTInnAuHRHN-LpGCqMzm2RM/exec?page=admin"
  allow="camera; microphone; geolocation; fullscreen"
  onload="hideSplash()"></iframe>

<!-- Offline -->
<div id="offline">
  <div class="icon">📡</div>
  <h3>Tidak Ada Koneksi Internet</h3>
  <p>Admin panel membutuhkan internet untuk mengambil data. Periksa koneksi WiFi/data Anda.</p>
  <button onclick="reloadApp()">Coba Lagi</button>
</div>

<div id="toast"></div>

<!-- Info badge (hilang setelah install) -->
<div class="info-badge" id="infoBadge">
  <span>🛡️</span>
  <span>ARSA <b>ADMIN</b> — Bukan aplikasi absensi karyawan</span>
</div>

<script>
// ===== 1. REGISTER SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker-admin.js')
      .then(reg => console.log('[PWA] SW OK:', reg.scope))
      .catch(err => console.log('[PWA] SW fail:', err));
  });
}

// ===== 2. DETEKSI STANDALONE (sudah di-install) =====
function checkStandalone() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (standalone) {
    document.body.classList.add('standalone');
    const badge = document.getElementById('infoBadge');
    if (badge) badge.style.display = 'none';
  }
}
checkStandalone();
window.matchMedia('(display-mode: standalone)').addEventListener('change', checkStandalone);

// ===== 3. INSTALL PROMPT =====
let deferredPrompt = null;
const btnInstall = document.getElementById('btnInstall');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.classList.remove('hidden');
  showToast('📲 Aplikasi siap di-install!');
});

async function doInstall() {
  if (!deferredPrompt) {
    showToast('⚠️ Tap menu ⋮ → "Install app"');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    showToast('✅ Instalasi dimulai...');
    btnInstall.classList.add('hidden');
  }
  deferredPrompt = null;
}

window.addEventListener('appinstalled', () => {
  btnInstall.classList.add('hidden');
  const badge = document.getElementById('infoBadge');
  if (badge) badge.style.display = 'none';
  showToast('🎉 ARSA Admin ter-install!');
});

// ===== 4. HELPER =====
function reloadApp() {
  const f = document.getElementById('appFrame');
  document.getElementById('splash').classList.remove('hide');
  f.src = f.src;
  setTimeout(hideSplash, 4000);
}
function hideSplash() {
  document.getElementById('splash').classList.add('hide');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== 5. ONLINE/OFFLINE =====
window.addEventListener('offline', () => document.getElementById('offline').classList.add('show'));
window.addEventListener('online', () => document.getElementById('offline').classList.remove('show'));
if (!navigator.onLine) document.getElementById('offline').classList.add('show');
</script>
</body>
</html>
