<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ARSA Admin - Command Center</title>
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARSA Admin">
<meta name="application-name" content="ARSA Admin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../logo-AKI.png">
<link rel="icon" type="image/png" href="../logo-AKI.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050806;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#topBar{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#1a1f1c,#0d120f);border-bottom:1px solid rgba(251,191,36,.2);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
body.standalone #topBar{display:none}
body.standalone #appFrame{top:0!important}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:contain;background:#0a0f0d;border:1px solid rgba(251,191,36,.25)}
.brand-text{display:flex;flex-direction:column}
.brand-text .name{font-weight:800;font-size:14px;color:#fbbf24;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text .sub{font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-shrink:0}
.act-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);color:#fbbf24;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.act-btn:active{transform:scale(.95)}
#btnInstall{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;box-shadow:0 4px 14px rgba(245,158,11,.4)}
#btnInstall.hidden{display:none!important}
#appFrame{position:fixed;top:56px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 56px);border:0;background:#050806}
#splash{position:fixed;inset:0;z-index:90;background:#050806;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:80px;height:80px;border-radius:20px;object-fit:contain;background:#0a0f0d;border:1px solid rgba(251,191,36,.3);box-shadow:0 8px 32px rgba(245,158,11,.35);animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#splash .title{color:#fbbf24;font-weight:800;font-size:16px;letter-spacing:2px;text-transform:uppercase}
#splash .subtitle{color:#94a3b8;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:-6px}
.spinner{width:34px;height:34px;border:3px solid rgba(251,191,36,.2);border-top-color:#f59e0b;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#offline{position:fixed;inset:0;z-index:120;background:rgba(5,8,6,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f1f5f9;text-align:center;padding:24px}
#offline.show{display:flex}
#offline .icon{font-size:48px}
#offline h3{color:#fbbf24;font-size:16px}
#offline p{font-size:12px;color:#94a3b8;max-width:280px}
#offline button{margin-top:8px;padding:10px 24px;border-radius:10px;background:#f59e0b;color:#000;font-weight:800;border:none;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(16,185,129,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;z-index:200;transition:transform .3s;max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="topBar">
  <div class="brand">
    <img src="../logo-AKI.png" alt="ARSA">
    <div class="brand-text">
      <span class="name">ARSA ADMIN</span>
      <span class="sub">Command Center</span>
    </div>
  </div>
  <div class="actions">
    <button class="act-btn" onclick="reloadApp()">🔄 Refresh</button>
    <button class="act-btn hidden" id="btnInstall" onclick="doInstall()">📲 Install</button>
  </div>
</div>
<div id="splash">
  <img src="../logo-AKI.png" alt="ARSA">
  <div class="title">ARSA ADMIN</div>
  <div class="subtitle">Command Center</div>
  <div class="spinner"></div>
</div>
<iframe id="appFrame"
  src="https://script.google.com/macros/s/AKfycbypofLYPOd7q_SBKEx7_eYXktqRp9b8cPNO4hO1yUE4BdTInnAuHRHN-LpGCqMzm2RM/exec?page=admin"
  allow="camera; microphone; geolocation; fullscreen"
  onload="hideSplash()"></iframe>
<div id="offline">
  <div class="icon">📡</div>
  <h3>Tidak Ada Koneksi Internet</h3>
  <p>Admin panel membutuhkan internet untuk mengambil data.</p>
  <button onclick="reloadApp()">Coba Lagi</button>
</div>
<div id="toast"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('[PWA Admin] SW OK, scope:', reg.scope))
      .catch(err => console.log('[PWA Admin] SW fail:', err));
  });
}
function checkStandalone(){
  const s = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (s) document.body.classList.add('standalone');
}
checkStandalone();
window.matchMedia('(display-mode: standalone)').addEventListener('change', checkStandalone);

let deferredPrompt = null;
const btnInstall = document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.classList.remove('hidden');
  showToast('📲 Aplikasi siap di-install!');
});
async function doInstall(){
  if (!deferredPrompt){ showToast('⚠️ Tap menu ⋮ → "Install app"'); return; }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted'){ showToast('✅ Instalasi dimulai...'); btnInstall.classList.add('hidden'); }
  deferredPrompt = null;
}
window.addEventListener('appinstalled', () => {
  btnInstall.classList.add('hidden');
  showToast('🎉 ARSA Admin ter-install!');
});
function reloadApp(){
  const f = document.getElementById('appFrame');
  document.getElementById('splash').classList.remove('hide');
  f.src = f.src;
  setTimeout(hideSplash, 4000);
}
function hideSplash(){ document.getElementById('splash').classList.add('hide'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
window.addEventListener('offline', () => document.getElementById('offline').classList.add('show'));
window.addEventListener('online', () => document.getElementById('offline').classList.remove('show'));
if (!navigator.onLine) document.getElementById('offline').classList.add('show');
</script>
</body>
</html>
